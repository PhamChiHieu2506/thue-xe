server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${APP_DB_USER:auth_app}
    password: ${APP_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  lifecycle:
    timeout-per-shutdown-phase: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: false
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    hostname: ${SERVICE_HOST:localhost}
    prefer-ip-address: false
    instance-id: ${INSTANCE_ID:${spring.application.name}-${server.port}}
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  jwt:
    issuer: ${JWT_ISSUER:https://ptpmhdv.local/auth}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../.local/keys/public-key.pem}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:../.local/keys/private-key.pem}
    ttl-seconds: 900
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:}
