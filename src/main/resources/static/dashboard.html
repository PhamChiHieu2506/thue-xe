<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="VeloDrive — tìm xe tự lái, gửi yêu cầu và quản lý chuyến đi."
    />
    <title>VeloDrive · Thuê xe tự lái</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="header">
      <a href="#cars" class="logo"><span>V</span> VeloDrive</a>
      <nav id="nav" aria-label="Điều hướng chính"></nav>
      <div id="session"></div>
    </header>
    <main id="app" tabindex="-1">
      <p class="loading">Đang tải xe cho thuê…</p>
    </main>
    <footer>
      <a href="#cars" class="logo">VeloDrive</a>
      <p>Chọn xe. Chủ động hành trình.</p>
    </footer>
    <dialog id="modal">
      <div class="dialog-head">
        <h2 id="modal-title"></h2>
        <button
          type="button"
          class="icon"
          data-action="close"
          aria-label="Đóng"
        >
          ×
        </button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
